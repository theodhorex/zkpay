[package]
name = "zkpay-core"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
orchard = "=0.15.5"
prost = "0.14.4"
sapling-crypto = "=0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zcash_address = "0.13.0"
zcash_client_backend = "0.24.0"
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling", "transparent-key-encoding"] }
zcash_note_encryption = "=0.4.2"
zcash_protocol = "0.10.6"
zip32 = "=0.2.1"
